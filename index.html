<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珈琲のひみつ ― ずんだもん＆四国めたん</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}

  /* ===== 16:9 画面 ===== */
  #screen{position:relative;width:100vw;max-width:960px;aspect-ratio:16/9;overflow:hidden;background:#1a1a2e}

  /* 背景 */
  #bg{position:absolute;inset:0;background:linear-gradient(160deg,#3c2415 0%,#1a1a2e 50%,#16213e 100%);z-index:0}
  #bg::before{content:"\2615";position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-size:min(16vw,140px);opacity:.06}

  /* タイトル画面 */
  #title-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(0,0,0,.75);transition:opacity .6s}
  #title-card h1{font-size:clamp(1.2rem,3.5vw,2.2rem);color:#f5deb3;text-shadow:0 0 16px rgba(245,222,179,.4);margin-bottom:.2em;text-align:center}
  #title-card .sub{font-size:clamp(.7rem,1.8vw,.9rem);color:#aaa;margin-bottom:.5em}
  #title-card .credit{font-size:clamp(.5rem,1.2vw,.65rem);color:#666;margin-bottom:1em;text-align:center;line-height:1.5}
  #title-card .credit a{color:#888;text-decoration:underline}
  #title-card button{font-size:clamp(.85rem,2.2vw,1.1rem);padding:.5em 1.8em;border:2px solid #f5deb3;background:transparent;color:#f5deb3;border-radius:8px;cursor:pointer;transition:all .3s}
  #title-card button:hover{background:#f5deb3;color:#1a1a2e}

  /* === キャラクター（左右に配置、下寄せ） === */
  #characters{position:absolute;top:0;left:0;right:0;bottom:30%;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;padding:0 3%;pointer-events:none}
  .chara{display:flex;flex-direction:column;align-items:center;transition:opacity .4s,transform .4s,filter .4s}
  .chara img{display:block;height:calc((100vw * 9 / 16) * 0.60);max-height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 2px 12px rgba(0,0,0,.6))}
  @media(min-width:960px){.chara img{height:calc(540px * 0.60)}}
  .chara.speaking{transform:translateY(-3px)}
  .chara.speaking img{filter:drop-shadow(0 2px 16px rgba(255,255,255,.15))}
  .chara.inactive{opacity:.3;filter:grayscale(.4)}
  .chara-name{margin-top:.1em;font-size:clamp(.5rem,1.3vw,.7rem);font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  #zunda .chara-name{color:#a8e063}
  #metan .chara-name{color:#f48fb1}

  /* === 字幕（下部30%） === */
  #subtitle-area{position:absolute;bottom:20px;left:0;right:0;top:70%;z-index:2;background:rgba(0,0,0,.82);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;padding:0 1em}
  #subtitle{font-size:clamp(.65rem,1.8vw,1rem);line-height:1.5;text-align:center;max-width:95%}
  #speaker-tag{position:absolute;top:0;left:.8em;font-size:clamp(.45rem,1.1vw,.58rem);padding:.05em .45em;border-radius:0 0 3px 3px;font-weight:bold}
  #speaker-tag.zunda{background:#56ab2f;color:#fff}
  #speaker-tag.metan{background:#c2185b;color:#fff}

  /* === コントロール（最下部バー） === */
  #controls{position:absolute;bottom:0;left:0;right:0;height:20px;z-index:3;background:rgba(0,0,0,.7);display:flex;align-items:center;gap:.5em;padding:0 .5em}
  #btn-pause{background:none;border:none;color:#ccc;cursor:pointer;font-size:clamp(.55rem,1.2vw,.7rem);padding:0 .3em;line-height:1}
  #btn-pause:hover{color:#f5deb3}
  #progress{flex:1;height:3px;background:#333;border-radius:2px;overflow:hidden}
  #progress-bar{height:100%;width:0;background:linear-gradient(90deg,#56ab2f,#f48fb1);transition:width .3s}
  #step-label{color:#666;font-size:clamp(.45rem,1vw,.55rem);min-width:2.5em;text-align:right}
</style>
</head>
<body>

<div id="screen">
  <div id="bg"></div>

  <!-- タイトル画面 -->
  <div id="title-card">
    <h1>&#9749; 珈琲のひみつ &#9749;</h1>
    <p class="sub">ずんだもん ＆ 四国めたん</p>
    <p class="credit">
      音声: ブラウザ内蔵 SpeechSynthesis (Web Speech API)<br>
      キャラクター: ずんだもん・四国めたん (<a href="https://voicevox.hiroshiba.jp/" target="_blank">VOICEVOX</a>)
    </p>
    <button onclick="startPlay()">&#9654; さいせい</button>
  </div>

  <!-- キャラクター -->
  <div id="characters">
    <div id="zunda" class="chara inactive">
      <img src="images/zundamon.png" alt="ずんだもん">
      <div class="chara-name">ずんだもん</div>
    </div>
    <div id="metan" class="chara inactive">
      <img src="images/metan.png" alt="四国めたん">
      <div class="chara-name">四国めたん</div>
    </div>
  </div>

  <!-- 字幕 -->
  <div id="subtitle-area">
    <div id="speaker-tag"></div>
    <div id="subtitle"></div>
  </div>

  <!-- コントロール -->
  <div id="controls">
    <button id="btn-pause" onclick="togglePause()" title="再生/一時停止">&#9208;</button>
    <div id="progress"><div id="progress-bar"></div></div>
    <div id="step-label"></div>
  </div>
</div>

<script>
const SCRIPT = [
  {s:"zunda", t:"どうも、ずんだもんなのだ！\n今日は珈琲の豆知識を紹介するのだ！",
               v:"どうも、ずんだもんなのだ！今日は珈琲の豆知識を紹介するのだ！"},
  {s:"metan", t:"四国めたんですわ。\n珈琲、わたくしも大好きですの。",
               v:"四国めたんですわ。珈琲、わたくしも大好きですの。"},
  {s:"zunda", t:"突然だけど、珈琲を最初に発見したのは\n「ヤギ」なのだ。",
               v:"突然だけど、珈琲を最初に発見したのはヤギなのだ。"},
  {s:"metan", t:"……ヤギですの？",
               v:"ヤギですの？"},
  {s:"zunda", t:"エチオピアのヤギ飼いが、\n赤い実を食べたヤギが夜中まで大はしゃぎしてるのを見て、\n珈琲が発見されたと言われているのだ。",
               v:"エチオピアのヤギ飼いが、赤い実を食べたヤギが夜中まで大はしゃぎしてるのを見て、珈琲が発見されたと言われているのだ。"},
  {s:"metan", t:"まあ、ヤギがカフェインで\n興奮してしまったということですの？",
               v:"まあ、ヤギがカフェインで興奮してしまったということですの？"},
  {s:"zunda", t:"そういうことなのだ。あと、もうひとつ。",
               v:"そういうことなのだ。あと、もうひとつ。"},
  {s:"zunda", t:"深煎りの珈琲と浅煎りの珈琲、\nカフェインが多いのはどっちだと思うのだ？",
               v:"深煎りの珈琲と浅煎りの珈琲、カフェインが多いのはどっちだと思うのだ？"},
  {s:"metan", t:"それは深煎りではなくて？\n苦いですし。",
               v:"それは深煎りではなくて？苦いですし。"},
  {s:"zunda", t:"実は浅煎りの方がカフェインは多いのだ！\n焙煎でカフェインは分解されるのだ。",
               v:"実は浅煎りの方がカフェインは多いのだ！焙煎でカフェインは分解されるのだ。"},
  {s:"metan", t:"えっ……！\n苦さとカフェインは関係ありませんの？\nそれは驚きですわ。",
               v:"えっ！苦さとカフェインは関係ありませんの？それは驚きですわ。"},
  {s:"zunda", t:"珈琲は知れば知るほど面白い飲み物なのだ。\nみんなもぜひ味わってみてほしいのだ！",
               v:"珈琲は知れば知るほど面白い飲み物なのだ。みんなもぜひ味わってみてほしいのだ！"},
  {s:"metan", t:"面白かったらグッドボタンをお願いしますわ。\nそれでは、ごきげんよう。",
               v:"面白かったらグッドボタンをお願いしますわ。それでは、ごきげんよう。"},
  {s:"zunda", t:"ばいばいなのだ！",
               v:"ばいばいなのだ！"},
];

const NAMES = { zunda: "ずんだもん", metan: "四国めたん" };
const STEP_GAP = 500; // セリフ間の間隔(ms)

let idx = -1;
let paused = false;
let playing = false;
let jaVoice = null;

/* 日本語音声を取得 */
function _pickJaVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang === "ja-JP")
      || voices.find(v => v.lang.startsWith("ja"))
      || null;
}

/* 音声リストは非同期で読み込まれる場合がある */
speechSynthesis.onvoiceschanged = () => { jaVoice = _pickJaVoice(); };
jaVoice = _pickJaVoice();

/* 字幕・キャラUI更新 */
function _updateUI(i) {
  idx = i;
  const line = SCRIPT[i];
  document.getElementById("subtitle").innerHTML = line.t.replace(/\n/g, "<br>");
  const tag = document.getElementById("speaker-tag");
  tag.textContent = NAMES[line.s];
  tag.className = line.s;
  for (const k of ["zunda","metan"]) {
    const el = document.getElementById(k);
    el.classList.toggle("speaking", k === line.s);
    el.classList.toggle("inactive", k !== line.s);
  }
  document.getElementById("progress-bar").style.width =
    ((i + 1) / SCRIPT.length * 100) + "%";
  document.getElementById("step-label").textContent = (i+1)+"/"+SCRIPT.length;
}

/* 1行読み上げ → Promise で完了を返す */
function speakLine(i) {
  return new Promise(resolve => {
    const line = SCRIPT[i];
    _updateUI(i);

    const utter = new SpeechSynthesisUtterance(line.v);
    utter.lang = "ja-JP";
    if (jaVoice) utter.voice = jaVoice;
    utter.rate = 1.15;
    utter.pitch = line.s === "zunda" ? 1.3 : 1.0;

    utter.onend = () => resolve();
    utter.onerror = () => resolve();

    speechSynthesis.speak(utter);
  });
}

/* 再生ループ */
async function startPlay() {
  const card = document.getElementById("title-card");
  card.style.opacity = "0";
  setTimeout(() => card.style.display = "none", 500);

  playing = true;
  paused = false;
  document.getElementById("btn-pause").textContent = "\u23F8";

  for (let i = 0; i < SCRIPT.length; i++) {
    if (!playing) break;

    // 一時停止中なら再開を待つ
    while (paused) {
      await new Promise(r => setTimeout(r, 100));
    }

    await speakLine(i);

    // セリフ間の間隔（最後のセリフの後は不要）
    if (i < SCRIPT.length - 1) {
      await new Promise(r => setTimeout(r, STEP_GAP));
    }
  }

  playing = false;
}

function togglePause() {
  if (!playing) return;
  paused = !paused;
  document.getElementById("btn-pause").textContent = paused ? "\u25B6" : "\u23F8";
  if (paused) {
    speechSynthesis.pause();
  } else {
    speechSynthesis.resume();
  }
}

document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "p") { e.preventDefault(); togglePause(); }
});

let touchStartX = 0;
document.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(dx) < 20) togglePause();
});
</script>
</body>
</html>
