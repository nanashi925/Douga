<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珈琲のひみつ ― ずんだもん＆四国めたん</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}

  /* ===== 16:9 画面 ===== */
  #screen{position:relative;width:100vw;max-width:960px;aspect-ratio:16/9;overflow:hidden;background:#1a1a2e}

  /* 背景 */
  #bg{position:absolute;inset:0;background:linear-gradient(160deg,#3c2415 0%,#1a1a2e 50%,#16213e 100%);z-index:0}
  #bg::before{content:"\2615";position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-size:min(16vw,140px);opacity:.06}

  /* タイトル画面 */
  #title-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(0,0,0,.75);transition:opacity .6s}
  #title-card h1{font-size:clamp(1.2rem,3.5vw,2.2rem);color:#f5deb3;text-shadow:0 0 16px rgba(245,222,179,.4);margin-bottom:.2em;text-align:center}
  #title-card .sub{font-size:clamp(.7rem,1.8vw,.9rem);color:#aaa;margin-bottom:.5em}
  #title-card .credit{font-size:clamp(.5rem,1.2vw,.65rem);color:#666;margin-bottom:1em;text-align:center;line-height:1.5}
  #title-card .credit a{color:#888;text-decoration:underline}
  #title-card button{font-size:clamp(.85rem,2.2vw,1.1rem);padding:.5em 1.8em;border:2px solid #f5deb3;background:transparent;color:#f5deb3;border-radius:8px;cursor:pointer;transition:all .3s}
  #title-card button:hover{background:#f5deb3;color:#1a1a2e}

  /* === キャラクター（左右に配置、下寄せ） === */
  #characters{position:absolute;top:0;left:0;right:0;bottom:30%;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;padding:0 3%;pointer-events:none}
  .chara{display:flex;flex-direction:column;align-items:center;transition:opacity .4s,transform .4s,filter .4s}
  .chara img{display:block;height:calc((100vw * 9 / 16) * 0.60);max-height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 2px 12px rgba(0,0,0,.6))}
  @media(min-width:960px){.chara img{height:calc(540px * 0.60)}}
  .chara.speaking{transform:translateY(-3px)}
  .chara.speaking img{filter:drop-shadow(0 2px 16px rgba(255,255,255,.15))}
  .chara.inactive{opacity:.3;filter:grayscale(.4)}
  .chara-name{margin-top:.1em;font-size:clamp(.5rem,1.3vw,.7rem);font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  #zunda .chara-name{color:#a8e063}
  #metan .chara-name{color:#f48fb1}

  /* === 字幕（下部30%） === */
  #subtitle-area{position:absolute;bottom:20px;left:0;right:0;top:70%;z-index:2;background:rgba(0,0,0,.82);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;padding:0 1em}
  #subtitle{font-size:clamp(.65rem,1.8vw,1rem);line-height:1.5;text-align:center;max-width:95%}
  #speaker-tag{position:absolute;top:0;left:.8em;font-size:clamp(.45rem,1.1vw,.58rem);padding:.05em .45em;border-radius:0 0 3px 3px;font-weight:bold}
  #speaker-tag.zunda{background:#56ab2f;color:#fff}
  #speaker-tag.metan{background:#c2185b;color:#fff}

  /* === コントロール（最下部バー） === */
  #controls{position:absolute;bottom:0;left:0;right:0;height:20px;z-index:3;background:rgba(0,0,0,.7);display:flex;align-items:center;gap:.5em;padding:0 .5em}
  #btn-pause{background:none;border:none;color:#ccc;cursor:pointer;font-size:clamp(.55rem,1.2vw,.7rem);padding:0 .3em;line-height:1}
  #btn-pause:hover{color:#f5deb3}
  #progress{flex:1;height:3px;background:#333;border-radius:2px;overflow:hidden}
  #progress-bar{height:100%;width:0;background:linear-gradient(90deg,#56ab2f,#f48fb1);transition:width .3s}
  #step-label{color:#666;font-size:clamp(.45rem,1vw,.55rem);min-width:2.5em;text-align:right}
</style>
</head>
<body>

<div id="screen">
  <div id="bg"></div>

  <!-- タイトル画面 -->
  <div id="title-card">
    <h1>&#9749; 珈琲のひみつ &#9749;</h1>
    <p class="sub">ずんだもん ＆ 四国めたん</p>
    <p class="credit">
      音声: <a href="https://voicevox.hiroshiba.jp/" target="_blank">VOICEVOX</a> ずんだもん・四国めたん<br>
      音声API: <a href="https://api.tts.quest/" target="_blank">ttsQuestV3</a>
    </p>
    <button onclick="startPlay()">&#9654; さいせい</button>
  </div>

  <!-- キャラクター -->
  <div id="characters">
    <div id="zunda" class="chara inactive">
      <img src="images/zundamon.png" alt="ずんだもん">
      <div class="chara-name">ずんだもん</div>
    </div>
    <div id="metan" class="chara inactive">
      <img src="images/metan.png" alt="四国めたん">
      <div class="chara-name">四国めたん</div>
    </div>
  </div>

  <!-- 字幕 -->
  <div id="subtitle-area">
    <div id="speaker-tag"></div>
    <div id="subtitle"></div>
  </div>

  <!-- コントロール -->
  <div id="controls">
    <button id="btn-pause" onclick="togglePause()" title="再生/一時停止">&#9208;</button>
    <div id="progress"><div id="progress-bar"></div></div>
    <div id="step-label"></div>
  </div>
</div>

<script>
const SCRIPT = [
  {s:"zunda", t:"どうも、ずんだもんなのだ！\n今日は珈琲の豆知識を紹介するのだ！",
               v:"どうも、ずんだもんなのだ！今日は珈琲の豆知識を紹介するのだ！"},
  {s:"metan", t:"四国めたんですわ。\n珈琲、わたくしも大好きですの。",
               v:"四国めたんですわ。珈琲、わたくしも大好きですの。"},
  {s:"zunda", t:"突然だけど、珈琲を最初に発見したのは\n「ヤギ」なのだ。",
               v:"突然だけど、珈琲を最初に発見したのはヤギなのだ。"},
  {s:"metan", t:"……ヤギですの？",
               v:"ヤギですの？"},
  {s:"zunda", t:"エチオピアのヤギ飼いが、\n赤い実を食べたヤギが夜中まで大はしゃぎしてるのを見て、\n珈琲が発見されたと言われているのだ。",
               v:"エチオピアのヤギ飼いが、赤い実を食べたヤギが夜中まで大はしゃぎしてるのを見て、珈琲が発見されたと言われているのだ。"},
  {s:"metan", t:"まあ、ヤギがカフェインで\n興奮してしまったということですの？",
               v:"まあ、ヤギがカフェインで興奮してしまったということですの？"},
  {s:"zunda", t:"そういうことなのだ。あと、もうひとつ。",
               v:"そういうことなのだ。あと、もうひとつ。"},
  {s:"zunda", t:"深煎りの珈琲と浅煎りの珈琲、\nカフェインが多いのはどっちだと思うのだ？",
               v:"深煎りの珈琲と浅煎りの珈琲、カフェインが多いのはどっちだと思うのだ？"},
  {s:"metan", t:"それは深煎りではなくて？\n苦いですし。",
               v:"それは深煎りではなくて？苦いですし。"},
  {s:"zunda", t:"実は浅煎りの方がカフェインは多いのだ！\n焙煎でカフェインは分解されるのだ。",
               v:"実は浅煎りの方がカフェインは多いのだ！焙煎でカフェインは分解されるのだ。"},
  {s:"metan", t:"えっ……！\n苦さとカフェインは関係ありませんの？\nそれは驚きですわ。",
               v:"えっ！苦さとカフェインは関係ありませんの？それは驚きですわ。"},
  {s:"zunda", t:"珈琲は知れば知るほど面白い飲み物なのだ。\nみんなもぜひ味わってみてほしいのだ！",
               v:"珈琲は知れば知るほど面白い飲み物なのだ。みんなもぜひ味わってみてほしいのだ！"},
  {s:"metan", t:"面白かったらグッドボタンをお願いしますわ。\nそれでは、ごきげんよう。",
               v:"面白かったらグッドボタンをお願いしますわ。それでは、ごきげんよう。"},
  {s:"zunda", t:"ばいばいなのだ！",
               v:"ばいばいなのだ！"},
];

const SPEAKER_ID = { zunda: 3, metan: 2 };
const NAMES      = { zunda: "ずんだもん", metan: "四国めたん" };

/* === TTS（直列API呼び出し + 並列ポーリング） === */
const audioCache = {};
const pendingPromises = {};  // ck -> resolve[]
const queue = [];
let queueRunning = false;
let lastApiTime = 0;
const API_GAP = 500; // 429ハンドリング済のため短縮

function _w(ms) { return new Promise(r => setTimeout(r, ms)); }

function fetchAudio(text, speakerKey) {
  const ck = speakerKey + ":" + text;
  if (audioCache[ck]) return Promise.resolve(audioCache[ck]);
  if (pendingPromises[ck]) {
    return new Promise(resolve => pendingPromises[ck].push(resolve));
  }
  return new Promise(resolve => {
    pendingPromises[ck] = [resolve];
    queue.push({ ck, text, speakerKey });
    _processQueue();
  });
}

function prioritize(text, speakerKey) {
  const ck = speakerKey + ":" + text;
  const i = queue.findIndex(r => r.ck === ck);
  if (i > 0) queue.unshift(queue.splice(i, 1)[0]);
}

/* キュー処理：API呼び出しだけ直列。ポーリングはバックグラウンドで並列実行 */
async function _processQueue() {
  if (queueRunning) return;
  queueRunning = true;
  while (queue.length > 0) {
    const item = queue.shift();
    if (audioCache[item.ck]) {
      _resolvePending(item.ck, audioCache[item.ck]);
      continue;
    }
    const wait = API_GAP - (Date.now() - lastApiTime);
    if (wait > 0) await _w(wait);
    lastApiTime = Date.now();
    const r = await _callApi(item.text, item.speakerKey);
    if (r.url) {
      // mp3をblobダウンロード（バックグラウンド、キュー非ブロック）
      _blobAndResolve(item.ck, r.url);
    } else if (r.statusUrl) {
      // ポーリング→blobダウンロード（バックグラウンド）
      _pollAndResolve(item.ck, r.statusUrl, r.dlUrl, r.stUrl);
    } else {
      _resolvePending(item.ck, null);
    }
  }
  queueRunning = false;
}

function _resolvePending(ck, url) {
  const list = pendingPromises[ck];
  delete pendingPromises[ck];
  if (list) list.forEach(fn => fn(url));
}

/* API呼び出しのみ（ポーリングは含まない） */
async function _callApi(text, speakerKey) {
  const sid = SPEAKER_ID[speakerKey];
  const apiUrl = "https://api.tts.quest/v3/voicevox/synthesis?speaker="
    + sid + "&text=" + encodeURIComponent(text);
  for (let a = 0; a < 4; a++) {
    try {
      const res = await fetch(apiUrl);
      if (res.status === 429) {
        const body = await res.json().catch(() => ({}));
        const delay = ((body.retryAfter || 5) + 1) * 1000;
        console.log("TTS 429, wait", delay, "ms");
        await _w(delay);
        lastApiTime = Date.now();
        continue;
      }
      if (!res.ok) { await _w(1500); continue; }
      const d = await res.json();
      const dlUrl = d.mp3DownloadUrl;
      const stUrl = d.mp3StreamingUrl;
      if (d.audioStatusUrl) {
        return { statusUrl: d.audioStatusUrl, dlUrl, stUrl };
      }
      const u = dlUrl || stUrl;
      if (u) return { url: u };
      await _w(1000);
    } catch (e) {
      await _w(1500 * (a + 1));
    }
  }
  return {};
}

/* mp3をblobとしてメモリに取り込む（再生時のダウンロード待ちゼロ） */
async function _toBlobUrl(remoteUrl) {
  try {
    const r = await fetch(remoteUrl);
    if (!r.ok) return remoteUrl;
    return URL.createObjectURL(await r.blob());
  } catch (e) { return remoteUrl; }
}

async function _blobAndResolve(ck, url) {
  const blobUrl = await _toBlobUrl(url);
  audioCache[ck] = blobUrl;
  _resolvePending(ck, blobUrl);
}

/* バックグラウンドポーリング → blob化 → resolve */
async function _pollAndResolve(ck, statusUrl, dlUrl, stUrl) {
  const ready = await _pollReady(statusUrl);
  const url = (ready && dlUrl) ? dlUrl : (stUrl || null);
  if (!url) { _resolvePending(ck, null); return; }
  const blobUrl = await _toBlobUrl(url);
  audioCache[ck] = blobUrl;
  _resolvePending(ck, blobUrl);
}

async function _pollReady(statusUrl) {
  for (let i = 0; i < 30; i++) {
    await _w(500);
    try {
      const r = await fetch(statusUrl);
      if (!r.ok) continue;
      const d = await r.json();
      if (d.isAudioReady) return true;
      if (d.isAudioError) return false;
    } catch (e) {}
  }
  return false;
}

function prefetchAll() {
  for (let i = 0; i < SCRIPT.length; i++) {
    const ck = SCRIPT[i].s + ":" + SCRIPT[i].v;
    if (!audioCache[ck] && !pendingPromises[ck]) {
      fetchAudio(SCRIPT[i].v, SCRIPT[i].s);
    }
  }
}

// ページ読み込み時に先読み開始（再生ボタンを待たない）
prefetchAll();

/* === 再生エンジン（末尾無音トリミング→0.5秒間隔で結合→一括再生） === */
const STEP_GAP = 0.5;
let audioCtx = null;
let playStartTime = 0;
let stepOffsets = [];
let totalDuration = 0;
let idx = -1;
let paused = false;
let animId = null;

/* 末尾の無音をカット */
function _trimEnd(buf) {
  const d = buf.getChannelData(0);
  let e = d.length - 1;
  while (e > 0 && Math.abs(d[e]) < 0.01) e--;
  e = Math.min(e + 1, d.length);
  if (e >= d.length - 100) return buf;
  const t = audioCtx.createBuffer(buf.numberOfChannels, e, buf.sampleRate);
  for (let c = 0; c < buf.numberOfChannels; c++)
    t.copyToChannel(buf.getChannelData(c).subarray(0, e), c);
  return t;
}

/* 全AudioBufferを0.5秒ギャップで1本に結合 */
function _merge(bufs) {
  const sr = (bufs.find(b => b) || {}).sampleRate || 24000;
  const gapLen = Math.floor(STEP_GAP * sr);
  const nCh = (bufs.find(b => b) || {}).numberOfChannels || 1;
  let totalLen = 0;
  const offsets = [];
  for (let i = 0; i < bufs.length; i++) {
    offsets.push(totalLen / sr);
    totalLen += bufs[i] ? bufs[i].length : 0;
    if (i < bufs.length - 1) totalLen += gapLen;
  }
  const merged = audioCtx.createBuffer(nCh, totalLen || 1, sr);
  for (let c = 0; c < nCh; c++) {
    const out = merged.getChannelData(c);
    let pos = 0;
    for (let i = 0; i < bufs.length; i++) {
      if (bufs[i]) {
        out.set(bufs[i].getChannelData(Math.min(c, bufs[i].numberOfChannels - 1)), pos);
        pos += bufs[i].length;
      }
      if (i < bufs.length - 1) pos += gapLen;
    }
  }
  return { merged, offsets, dur: totalLen / sr };
}

/* 字幕・キャラUI更新 */
function _updateUI(i) {
  idx = i;
  const line = SCRIPT[i];
  document.getElementById("subtitle").innerHTML = line.t.replace(/\n/g, "<br>");
  const tag = document.getElementById("speaker-tag");
  tag.textContent = NAMES[line.s];
  tag.className = line.s;
  for (const k of ["zunda","metan"]) {
    const el = document.getElementById(k);
    el.classList.toggle("speaking", k === line.s);
    el.classList.toggle("inactive", k !== line.s);
  }
}

/* requestAnimationFrame で字幕を音声位置に同期 */
function _sync() {
  if (!audioCtx || paused) return;
  const t = audioCtx.currentTime - playStartTime;
  let ni = 0;
  for (let i = stepOffsets.length - 1; i >= 0; i--) {
    if (t >= stepOffsets[i]) { ni = i; break; }
  }
  if (ni !== idx) _updateUI(ni);
  document.getElementById("progress-bar").style.width =
    Math.min(100, t / totalDuration * 100) + "%";
  document.getElementById("step-label").textContent = (idx+1)+"/"+SCRIPT.length;
  if (t < totalDuration + 0.5) animId = requestAnimationFrame(_sync);
}

async function startPlay() {
  const card = document.getElementById("title-card");
  card.style.opacity = "0";
  setTimeout(() => card.style.display = "none", 500);

  const sub = document.getElementById("subtitle");
  const tag = document.getElementById("speaker-tag");
  tag.textContent = ""; tag.className = "";

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // 1) 全音声URL取得
  const total = SCRIPT.length;
  let done = 0;
  sub.textContent = "\u97F3\u58F0\u3088\u307F\u3053\u307F\u4E2D\u2026 0/" + total;

  const urls = await Promise.all(
    SCRIPT.map(s =>
      Promise.race([
        fetchAudio(s.v, s.s),
        _w(25000).then(() => null)
      ]).then(url => {
        done++;
        sub.textContent = "\u97F3\u58F0\u3088\u307F\u3053\u307F\u4E2D\u2026 " + done + "/" + total;
        return url;
      })
    )
  );

  // 2) デコード
  sub.textContent = "\u97F3\u58F0\u30C7\u30B3\u30FC\u30C9\u4E2D\u2026";
  const rawBufs = [];
  for (let i = 0; i < urls.length; i++) {
    if (urls[i]) {
      try {
        const r = await fetch(urls[i]);
        const ab = await r.arrayBuffer();
        rawBufs.push(await audioCtx.decodeAudioData(ab));
      } catch (e) { rawBufs.push(null); }
    } else { rawBufs.push(null); }
  }

  // 3) 末尾無音トリミング → 0.5秒ギャップで結合
  const trimmed = rawBufs.map(b => b ? _trimEnd(b) : null);
  const { merged, offsets, dur } = _merge(trimmed);
  stepOffsets = offsets;
  totalDuration = dur;

  // 4) 再生
  const src = audioCtx.createBufferSource();
  src.buffer = merged;
  src.connect(audioCtx.destination);

  paused = false;
  document.getElementById("btn-pause").textContent = "\u23F8";

  playStartTime = audioCtx.currentTime;
  src.start();
  idx = -1;
  _sync();
}

function togglePause() {
  if (!audioCtx) return;
  paused = !paused;
  document.getElementById("btn-pause").textContent = paused ? "\u25B6" : "\u23F8";
  if (paused) {
    audioCtx.suspend();
    cancelAnimationFrame(animId);
  } else {
    audioCtx.resume();
    _sync();
  }
}

document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "p") { e.preventDefault(); togglePause(); }
});

let touchStartX = 0;
document.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(dx) < 20) togglePause();
});
</script>
</body>
</html>
